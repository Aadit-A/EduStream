<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | EduStream LMS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav">
        <div class="brand">EduStream LMS</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      <section class="form-card">
        <p class="eyebrow">Access your account</p>
        <h1>Login</h1>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="you@example.com" />
            <p class="field-error" id="loginEmailError"></p>
          </div>

          <div class="field-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Password" />
            <p class="field-error" id="loginPasswordError"></p>
          </div>

          <button type="submit" class="button primary wide-button">Login</button>
        </form>

        <div id="loginSuccess" class="success-message hidden" aria-live="polite">
          <p>Login successful.</p>
          <p id="loginUserDetails"></p>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
