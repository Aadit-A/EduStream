<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Details | EduStream LMS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav">
        <div class="brand">EduStream LMS</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="courses.html">Browse Courses</a>
          <a href="register.html">Register</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      <section class="intro-card" id="courseDetailCard">
        <p class="eyebrow">Course Overview</p>
        <h1 id="courseTitle">Loading course...</h1>

        <div class="detail-field" data-detail-field="category">
          <strong>Category:</strong>
          <span id="courseCategory">-</span>
        </div>

        <div class="detail-field" data-detail-field="description">
          <strong>Description:</strong>
          <p id="courseDescription">Loading description...</p>
        </div>

        <button type="button" class="button secondary" id="backToCoursesButton">Back to Courses</button>
      </section>

      <p id="courseError" class="success-message hidden" role="alert"></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/course-details.js"></script>
  </body>
</html>
